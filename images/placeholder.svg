<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F4"/>
      <stop offset="50%" stop-color="#F4ECE8"/>
      <stop offset="100%" stop-color="#EFE4DF"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5897F"/>
      <stop offset="100%" stop-color="#9C635A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B57A70" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#B57A70" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#8C6F69" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad)"/>

  <!-- Delicate Border Frame -->
  <rect x="16" y="16" width="368" height="468" rx="16" fill="none" stroke="#E5D6D0" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Center Glow -->
  <circle cx="200" cy="210" r="110" fill="url(#glow)"/>

  <!-- Icon Circle Card -->
  <circle cx="200" cy="205" r="54" fill="#FFFFFF" filter="url(#softShadow)"/>
  <circle cx="200" cy="205" r="53" fill="none" stroke="#F0E3DF" stroke-width="1.5"/>

  <!-- Garment / Hanger Minimalist Icon -->
  <g transform="translate(200, 205)" stroke="url(#iconGrad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Hook -->
    <path d="M0, -22 C-4, -22 -8, -18 -8, -14 C-8, -9 -2, -8 0, -4 L0, 0"/>
    <!-- Hanger Body -->
    <path d="M-28, 12 L0, 0 L28, 12"/>
    <path d="M-28, 12 Q0, 16 28, 12"/>
    <!-- Soft Drape / Hijab silhouette -->
    <path d="M-18, 14 C-16, 26 -12, 32 -10, 36 C-4, 38 4, 38 10, 36 C12, 32 16, 26 18, 14" opacity="0.6"/>
  </g>

  <!-- Arabic Heading -->
  <text x="200" y="300" text-anchor="middle" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="20" font-weight="700" fill="#4A3B39">
    صورة قيد التحديث
  </text>

  <!-- English Subtitle -->
  <text x="200" y="326" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="#8C7773">
    IMAGE PENDING
  </text>

  <!-- Brand pill -->
  <g transform="translate(200, 375)" filter="url(#softShadow)">
    <rect x="-85" y="-15" width="170" height="30" rx="15" fill="#FFFFFF" stroke="#EADBD6" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#9C635A">
      هبة حجاب • تشكيلة جديدة
    </text>
  </g>
</svg>
